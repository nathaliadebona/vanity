<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanity - Catálogo</title>
  <meta name="description" content="Vanity — seu diário pessoal de beleza">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/catalog.css">
</head>

<body>
    <header>
        <button type="button" id="lang-toggle">PT</button>
        <h1>Vanity</h1>
        <a href="profile.html" aria-label="Ver perfil">
            <img src="https://ui-avatars.com/api/?name=Nathalia" alt="">
        </a>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="feed.html"><i class="fa-solid fa-house"></i><span data-i18n="feed"> Feed</span></a></li>
            <li><a href="catalog.html" class="current"><i class="fa-solid fa-layer-group"></i><span data-i18n="catalog"> Catálogo</span></a></li>
            <li><a href="add-product.html" class="nav-add"><i class="fa-solid fa-plus"></i><span data-i18n="add-product"> Adicionar</span></a></li>
            <li><a href="explore.html"><i class="fa-solid fa-magnifying-glass"></i><span data-i18n="explore"> Explorar</span></a></li>
            <li><a href="profile.html" class="nav-profile"><i class="fa-solid fa-user"></i><span data-i18n="profile"> Perfil</span></a></li>
        </ul>
    </nav>

    <main>
        <div class="catalog-page">
            <div class="catalog-header">
                <h2 data-i18n="catalog-title">Meu catálogo</h2>
                <button type="button" id="filter-btn"><i class="fa-solid fa-sliders"></i></button>
            </div>
            <div class="catalog-filter hidden">
                <input type="text" placeholder="Buscar produto..." data-i18n-placeholder="search-product">
                <div class="category-buttons">
                    <button type="button" data-value="makeup" data-i18n="filter-makeup">Maquiagem</button>
                    <button type="button" data-value="skincare" data-i18n="filter-skincare">Skincare</button>
                    <button type="button" data-value="perfume" data-i18n="filter-perfume">Perfume</button>
                    <button type="button" data-value="hair" data-i18n="filter-hair">Cabelo</button>
                </div>
                <div class="status-buttons">
                    <button type="button" data-value="using" data-i18n="filter-using">Em uso</button>
                    <button type="button" data-value="finished" data-i18n="filter-finished">Acabou</button>
                    <button type="button" data-value="wishlist" data-i18n="filter-wishlist">Wishlist</button>
                </div>
                <div class="buy-again-buttons">
                    <button type="button" data-value="yes" data-i18n="filter-yes">Sim</button>
                    <button type="button" data-value="no" data-i18n="filter-no">Não</button>
                </div>
                <button type="button" class="favorite-filter">
                    <i class="fa-regular fa-heart"></i> <span data-i18n="filter-favorites">Favoritos</span>
                </button>
            </div>
            <section class="catalog-grid">
                <article class="product-card" data-category="hair" data-status="using" data-buy-again="yes">
                    <div class="card-image">
                        <img src="" alt="">
                        <button type="button" class="favorite-btn">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-content">
                         <div class="tags-row">
                            <span class="category-tag">Categoria</span>
                            <span class="status-tag">Status</span>
                        </div>
                        <h3>Nome do produto</h3>
                        <p class="product-brand">Marca</p>
                        <div class="rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>
                    </div>
                </article>
                <article class="product-card" data-category="makeup" data-status="using" data-buy-again="no">
                    <div class="card-image">
                        <img src="" alt="">
                        <button type="button" class="favorite-btn">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-content">
                         <div class="tags-row">
                            <span class="category-tag">Categoria</span>
                            <span class="status-tag">Status</span>
                        </div>
                        <h3>Nome do produto</h3>
                        <p class="product-brand">Marca</p>
                        <div class="rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>
                    </div>
                </article>
                <article class="product-card" data-category="skincare" data-status="finished" data-buy-again="no">
                    <div class="card-image">
                        <img src="" alt="">
                        <button type="button" class="favorite-btn">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-content">
                         <div class="tags-row">
                            <span class="category-tag">Categoria</span>
                            <span class="status-tag">Status</span>
                        </div>
                        <h3>Nome do produto</h3>
                        <p class="product-brand">Marca</p>
                        <div class="rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>
                    </div>
                </article>
                <article class="product-card" data-category="perfume" data-status="wishlist" data-buy-again="yes">
                    <div class="card-image">
                        <img src="" alt="">
                        <button type="button" class="favorite-btn">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                    <div class="card-content">
                         <div class="tags-row">
                            <span class="category-tag">Categoria</span>
                            <span class="status-tag">Status</span>
                        </div>
                        <h3>Nome do produto</h3>
                        <p class="product-brand">Marca</p>
                        <div class="rating">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-regular fa-star"></i>
                        </div>
                    </div>
                </article>
            </section>
        </div>
    </main>
    
    <script src="scripts/auth-guard.js" type="module"></script>
    <script src="scripts/product-interactions.js"></script>
    <script src="scripts/catalog.js"></script>
    <script src="scripts/i18n.js" type="module"></script>
</body>
</html>
