<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanity - Perfil</title>
  <meta name="description" content="Vanity — seu diário pessoal de beleza">
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/profile.css">
</head>

<body>
    <header>
        <button type="button" id="lang-toggle">PT</button>
        <h1>Vanity</h1>
        <a href="profile.html" aria-label="Ver perfil">
            <img src="https://ui-avatars.com/api/?name=Nathalia" alt="">
        </a>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="feed.html"><i class="fa-solid fa-house"></i><span data-i18n="feed"> Feed</span></a></li>
            <li><a href="catalog.html"><i class="fa-solid fa-layer-group"></i><span data-i18n="catalog"> Catálogo</span></a></li>
            <li><a href="add-product.html" class="nav-add"><i class="fa-solid fa-plus"></i><span data-i18n="add-product"> Adicionar</span></a></li>
            <li><a href="explore.html"><i class="fa-solid fa-magnifying-glass"></i><span data-i18n="explore"> Explorar</span></a></li>
            <li><a href="profile.html" class="nav-profile current"><i class="fa-solid fa-user"></i><span data-i18n="profile"> Perfil</span></a></li>
        </ul>
    </nav>

    <main>
        <div class="profile-page">
            <div class="profile-top">
                <img src="https://ui-avatars.com/api/?name=Nathalia" alt="">
                <div class="profile-counters">
                    <div>
                        <span id="products-count"></span>
                        <p data-i18n="counter-products">Produtos</p>
                    </div>
                    <div>
                        <span id="followers-count"></span>
                        <p data-i18n="counter-followers">Seguidores</p>
                    </div>
                    <div>
                        <span id="following-count"></span>
                        <p data-i18n="counter-following">Seguindo</p>
                    </div>
                </div>
            </div>
            <div class="profile-info">
                <div class="profile-name-row">
                    <h2 class="profile-name">Nome e Sobrenome</h2>
                    <button id="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
                <p class="profile-username">@username</p>
                <p class="profile-bio">Biografia</p>
            </div>
            <button type="button" id="profile-edit-btn" data-i18n="profile-edit">
                Editar perfil
            </button>
            <button type="button" id="follow-btn" class="follow-btn" data-i18n="follow-btn">Seguir</button>
            <div class="profile-tabs">
                <button type="button" data-tab="products" data-i18n="tab-products" class="active">Produtos</button>
                <button type="button" data-tab="stats" data-i18n="tab-stats">Estatísticas</button>
            </div>
            <section class="products-tab">
                <div class="catalog-grid"></div>
            </section>
            <section class="stats-tab" style="display: none;">
                <div class="stats-summary">
                    <div>
                        <span>47</span>
                        <p>Produtos</p>
                    </div>
                    <div>
                        <span>18</span>
                        <p>Favoritos</p>
                    </div>
                    <div>
                        <span>32</span>
                        <p>Recompraria</p>
                    </div>
                </div>
                <div class="stats-chart">
                    <h4 data-i18n="chart-category">Por categoria</h4>
                    <div>
                        <span>Maquiagem</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 85%;"></div>
                        </div>
                    </div>
                    <div>
                        <span>Skincare</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 25%;"></div>
                        </div>
                    </div>
                    <div>
                        <span>Perfume</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 60%;"></div>
                        </div>
                    </div>
                    <div>
                        <span>Cabelo</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
                <div class="stats-chart">
                    <h4 data-i18n="chart-status">Por status</h4>
                    <div>
                        <span>Em uso</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 85%;"></div>
                        </div>
                    </div>
                    <div>
                        <span>Acabou</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 25%;"></div>
                        </div>
                    </div>
                    <div>
                        <span>Wishlist</span>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 60%;"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <dialog id="follow-modal">
        <div class="modal-header">
            <h3 id="follow-modal-title"></h3>
            <button type="button" id="follow-modal-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body people-list" id="follow-modal-list"></div>
    </dialog>

    <script src="scripts/auth-guard.js" type="module"></script>
    <script src="scripts/profile.js" type="module"></script>
    <script src="scripts/i18n.js" type="module"></script>
</body>
</html>
